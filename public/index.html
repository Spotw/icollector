<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cổng Thông tin dùng dung</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <h1>Cổng Thông tin</h1>
  <div class="clock3d">
    <div id="clockCanvas"></div>
    <div class="clock"><strong id="clock">--</strong></div>
  </div>

  <div class="card">
    <h2>Nhập thông tin</h2>
    <div class="row">
      <div class="field">
        <label for="loai">Loại thông tin *</label>
        <input id="loai" maxlength="100" placeholder="VD: Công việc, Ý tưởng...">
      </div>
      <div class="field">
        <label for="mota">Mô tả *</label>
        <input id="mota" maxlength="300" placeholder="Mô tả ngắn gọn">
      </div>
    </div>
    <div class="field">
      <label for="noidung">Nội dung thông tin</label>
      <textarea id="noidung" rows="4" placeholder="Nội dung chi tiết..."></textarea>
    </div>
    <button id="btnSave">Lưu</button><span class="msg" id="msg"></span>
  </div>

  <div class="card">
    <h2>Thông tin vừa thêm</h2>
    <div class="scroll">
      <table>
        <thead><tr><th>STT</th><th>Mô tả</th><th>Loại thông tin</th><th>Nội dung thông tin</th><th>Thời gian thêm</th><th></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.137.5/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
